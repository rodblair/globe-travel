name: Production release gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production base URL to check.
        required: false
        default: https://globe-travel-two.vercel.app
      share_slug:
        description: Public share slug used for production share and map-trust checks.
        required: false
        default: x3m2c8cnws
      include_prompt_actuals:
        description: Run prompt-suite validation using the production share actual.
        required: false
        type: choice
        options:
          - "1"
          - "0"
        default: "1"
      include_feedback_mutation:
        description: Insert/read/cleanup production feedback during an approved release window only.
        required: false
        type: choice
        options:
          - "0"
          - "1"
        default: "0"
      include_production_visual:
        description: Run public production visual QA and pixel diffs.
        required: false
        type: choice
        options:
          - "1"
          - "0"
        default: "1"
      include_production_viral:
        description: Run public share viral-loop affordance checks.
        required: false
        type: choice
        options:
          - "1"
          - "0"
        default: "1"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-release-gate
  cancel-in-progress: false

jobs:
  production-release-gate:
    name: Production release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      QA_BASE_URL: ${{ github.event.inputs.base_url || 'https://globe-travel-two.vercel.app' }}
      QA_SHARE_SLUG: ${{ github.event.inputs.share_slug || 'x3m2c8cnws' }}
      QA_INCLUDE_PROMPT_ACTUALS: ${{ github.event.inputs.include_prompt_actuals || '1' }}
      QA_INCLUDE_FEEDBACK_MUTATION: ${{ github.event.inputs.include_feedback_mutation || '0' }}
      QA_INCLUDE_PRODUCTION_VISUAL: ${{ github.event.inputs.include_production_visual || '1' }}
      QA_INCLUDE_PRODUCTION_VIRAL: ${{ github.event.inputs.include_production_viral || '1' }}
      QA_PRODUCTION_VISUAL_ARTIFACT_NAME: production-release-visual-${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Locate Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome executable not found on runner." >&2
            exit 1
          fi
          echo "QA_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run production release gate
        run: |
          set -o pipefail
          mkdir -p ../qa-ci
          npm run qa:release-production | tee ../qa-ci/production-release-gate.log

      - name: Upload release gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-gate-log
          path: qa-ci/production-release-gate.log
          if-no-files-found: error

      - name: Upload release visual artifacts
        if: ${{ always() && env.QA_INCLUDE_PRODUCTION_VISUAL != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-release-visual-${{ github.run_id }}
          path: qa/production-release-visual-${{ github.run_id }}/
          if-no-files-found: error
